# ========================================================
# ARROW PUZZLE LOAD BALANCER & REVERSE PROXY CONFIGURATION
# High-Availability Nginx Architecture with Round-Robin & Failover
# ========================================================

# Upstream cluster pool of horizontally scaled backend workers
upstream backend_cluster {
    # Least-connection algorithm for balanced load distribution
    least_conn;

    # Worker instance 1
    server backend-node-1:5000 max_fails=3 fail_timeout=10s;
    # Worker instance 2
    server backend-node-2:5000 max_fails=3 fail_timeout=10s;
    # Worker instance 3
    server backend-node-3:5000 max_fails=3 fail_timeout=10s;

    # Keepalive connections to backend servers
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    # Client body limit
    client_max_body_size 10M;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Swagger Documentation
    location /api/docs {
        proxy_pass http://backend_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Proxy with Load Balancing
    location /api/ {
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;

        # Connection headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts and failover
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;

        # Caching headers for level queries
        add_header X-Proxy-Cache $upstream_cache_status;
        add_header X-Handled-By $upstream_addr;
    }

    # Health check probe
    location /health {
        proxy_pass http://backend_cluster/api/health;
        proxy_set_header Host $host;
        access_log off;
    }
}
